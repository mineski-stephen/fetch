# Render Blueprint for the Gemini brief-extraction proxy.
# Use it when this folder is the root of its own repository:
#   Render → New → Blueprint → pick the repo → Apply.
services:
  - type: web
    name: gemini-pdf
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    plan: free
    envVars:
      - key: GEMINI_API_KEY
        sync: false            # optional shared key; leave empty if every user adds their own in Settings
      - key: GEMINI_MODEL
        value: auto            # newest gemini-X.Y-flash-lite available to the key
      - key: ALLOWED_ORIGINS
        value: "*"             # tighten to your page's origin once it's hosted
